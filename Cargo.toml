[workspace]
resolver = "3"
members = [ "crates/lumina", "crates/fdsm_lumina" ]

[workspace.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["debug", "winit", "tokio", "rfd", "wgpu", "multi-window",]

[workspace.dependencies.iced_wgpu]
git = "https://github.com/pop-os/libcosmic"

[workspace.dependencies.iced_graphics]
git = "https://github.com/pop-os/libcosmic"

[workspace.dependencies]
fdsm-skrifa = { git = "https://git.tfcconnection.org/chris/fdsm", version = "0.2.0" }
fdsm = { git = "https://git.tfcconnection.org/chris/fdsm", version = "0.8.0" }
skrifa = "0.40.0"
image = "0.25.8"
tracing = "0.1.40"

[profile.release]
opt-level = 3
debug = "line-tables-only"

[profile.dev]
opt-level = 3
debug = "line-tables-only"
# codegen-backend = "cranelift"

[profile.dev.package."*"]
opt-level = 3

# [profile.production]
# opt-level = 3
# lto = true
# codegen-units = 1
# panic = 'abort'
# strip = "symbols"
