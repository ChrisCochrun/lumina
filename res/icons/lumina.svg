<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="1199" viewBox="0 0 1312 1199" role="img" aria-labelledby="title desc">
<title id="title">Lumina gradient play ribbon</title>
<desc id="desc">An editable vector icon consisting of cyan, blue and violet overlapping rounded triangular ribbons.</desc>
<defs>
<path id="silhouette" fill-rule="evenodd" d="M 448 212 C 486 204 521 214 555 233 L 952 462 C 1011 496 1041 556 1041 627 C 1041 700 1006 763 952 807 L 581 1019 C 515 1057 432 1063 388 1039 C 305 994 259 919 259 836 L 259 418 C 259 306 351 225 448 212 Z M 506 443 C 489 442 474 452 474 473 L 473 784 C 473 810 487 817 515 816 C 524 816 533 813 542 809 L 794 669 C 829 648 831 628 804 606 L 544 458 C 530 450 518 444 506 443 Z"/>
<clipPath id="ribbon-clip"><use href="#silhouette"/></clipPath>
<linearGradient id="inner-teal" gradientUnits="userSpaceOnUse" x1="440" y1="445" x2="335" y2="955"><stop offset="0" stop-color="#009ba7"/><stop offset=".24" stop-color="#02b8c4"/><stop offset=".58" stop-color="#02e1e1"/><stop offset="1" stop-color="#04fafa"/></linearGradient>
<linearGradient id="upper-aqua" gradientUnits="userSpaceOnUse" x1="345" y1="235" x2="966" y2="550"><stop offset="0" stop-color="#adfcf1"/><stop offset=".25" stop-color="#7af9f3"/><stop offset=".54" stop-color="#15e5ef"/><stop offset=".78" stop-color="#00c4e9"/><stop offset="1" stop-color="#0095d8"/></linearGradient>
<linearGradient id="front-blue-violet" gradientUnits="userSpaceOnUse" x1="345" y1="1040" x2="1035" y2="585"><stop offset="0" stop-color="#1588f1"/><stop offset=".21" stop-color="#4a76fa"/><stop offset=".46" stop-color="#8c5dfb"/><stop offset=".64" stop-color="#646efa"/><stop offset=".83" stop-color="#328afb"/><stop offset="1" stop-color="#04bff0"/></linearGradient>
<linearGradient id="front-luster" gradientUnits="userSpaceOnUse" x1="620" y1="660" x2="660" y2="1030"><stop offset="0" stop-color="#076ee8" stop-opacity=".09"/><stop offset="1" stop-color="#bb47ff" stop-opacity=".12"/></linearGradient>
</defs>
<g clip-path="url(#ribbon-clip)">
<!-- Left leg, behind the upper and foreground folds -->
<path d="M 242 390 H 1070 V 1080 H 242 Z" fill="url(#inner-teal)"/>
<!-- Upper pale-to-cyan ribbon -->
<path d="M 259 418 C 259 306 351 225 448 212 C 486 204 521 214 555 233 L 952 462 C 966 478 956 518 932 549 C 914 572 849 616 798 650 C 815 633 814 613 804 606 L 544 458 C 514 441 488 434 462 433 C 363 427 283 504 259 620 Z" fill="url(#upper-aqua)"/>
<!-- Lower blue-violet ribbon, turning around the right tip -->
<path id="front-ribbon" d="M 952 462 C 1009 496 1041 556 1041 627 C 1041 700 1006 763 952 807 L 581 1019 C 515 1057 432 1063 388 1039 C 358 1023 338 1001 348 962 C 359 916 405 872 474 821 L 794 642 C 866 599 924 567 944 524 C 955 501 956 475 952 462 Z" fill="url(#front-blue-violet)"/>
<use href="#front-ribbon" fill="url(#front-luster)"/>
</g>
</svg>
